<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <title>Nihongo City · Controle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/build/phone-style.css">
</head>
<body>
  <header class="ph-head">
    <span class="ph-title">日本語シティ <small>controle</small></span>
    <span id="ph-status" class="ph-status"><span class="dot"></span> Conectando…</span>
  </header>
  <main id="ph-view" class="ph-view" aria-live="polite"></main>
  <footer class="ph-foot">
    <p id="ph-heard" class="ph-heard"></p>
    <form id="ph-type" class="ph-type" hidden>
      <input id="ph-text" lang="ja" placeholder="Digite em japonês" autocomplete="off">
      <button class="btn btn--primary" type="submit">Enviar</button>
    </form>
    <div class="ph-actions">
      <button id="ph-mic" class="btn btn--primary ph-mic" type="button" disabled>🎤 Falar</button>
      <button id="ph-kbd" class="icon-btn" type="button" aria-label="Digitar em vez de falar">⌨️</button>
    </div>
  </footer>
  <script src="/build/phone.js" defer></script>
</body>
</html>
