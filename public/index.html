<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <title>Nihongo City</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/build/app-style.css">
</head>
<body>
  <!-- Tela inicial -->
  <section id="start" class="start" aria-live="polite">
    <div class="start__panel">
      <p class="start__kanji" aria-hidden="true">日本語シティ</p>
      <h1 class="start__title">Nihongo City</h1>
      <p class="start__subtitle">Aprenda japonês vivendo Shibuya</p>
      <form id="start-form" class="start__form" hidden>
        <label for="player-name">Como você se chama?</label>
        <input id="player-name" name="name" maxlength="30" autocomplete="nickname" placeholder="Seu nome" required>
        <small class="start__hint">Já jogou? Digite o mesmo nome para voltar de onde parou.</small>
        <button class="btn btn--primary" type="submit">Entrar ▶</button>
      </form>
      <button id="start-btn" class="btn btn--primary btn--big" type="button" hidden>Toque para começar</button>
      <button id="switch-player" class="start__switch" type="button" hidden>Entrar com outro nome</button>
      <p id="start-msg" class="start__msg"></p>
    </div>
  </section>

  <main id="game" class="game" hidden>
    <!-- z0/z1: cidade estática + pontos clicáveis -->
    <div id="viewport" class="viewport">
      <div id="city" class="city">
        <img id="city-img" class="city__img" alt="" draggable="false">
        <div id="hotspots" class="hotspots" role="group" aria-label="Locais da cidade"></div>
      </div>
    </div>

    <!-- z2: véu durante eventos -->
    <div id="veil" class="veil" hidden></div>

    <!-- z3: NPC -->
    <div id="npc-layer" class="npc-layer" hidden>
      <img id="npc-img" class="npc" alt="">
    </div>

    <!-- z4: balão RPG -->
    <section id="dialogue" class="dialogue" hidden aria-live="polite">
      <div class="dialogue__box">
        <header class="dialogue__head">
          <span id="dlg-name" class="dialogue__name"></span>
          <span id="dlg-lives" class="dialogue__lives" aria-label="Erros"></span>
          <button id="dlg-close" class="icon-btn dialogue__close" type="button" aria-label="Sair do evento">✕</button>
        </header>
        <div id="dlg-body" class="dialogue__body"></div>
      </div>
    </section>

    <!-- z5: HUD -->
    <header class="hud">
      <div class="hud__left">
        <div class="profile" title="Nível e experiência">
          <span id="hud-level" class="profile__level">1</span>
          <div class="profile__info">
            <span id="hud-name" class="profile__name"></span>
            <span class="xpbar"><span id="hud-xp" class="xpbar__fill"></span></span>
          </div>
        </div>
        <button id="btn-deck" class="hud-btn" type="button" aria-label="Baralho">🃏<span class="hud-btn__label">Baralho</span><span id="badge-cards" class="badge"></span></button>
        <button id="btn-study" class="hud-btn" type="button" aria-label="Estudar">📖<span class="hud-btn__label">Estudar</span><span id="badge-due" class="badge badge--hot"></span></button>
        <button id="btn-tv" class="hud-btn" type="button" aria-label="Estudar com TV">📺<span class="hud-btn__label">Estudar com TV</span></button>
        <button id="btn-places" class="hud-btn" type="button" aria-label="Locais">📍<span class="hud-btn__label">Locais</span></button>
      </div>
      <div class="hud__center scene-switch">
        <button id="scene-prev" class="icon-btn" type="button" aria-label="Cena anterior">◀</button>
        <div class="scene-switch__name"><span id="scene-jp"></span><small id="scene-pt"></small></div>
        <button id="scene-next" class="icon-btn" type="button" aria-label="Próxima cena">▶</button>
      </div>
      <div class="hud__right">
        <button id="btn-remote" class="icon-btn icon-btn--remote" type="button" aria-label="Usar o celular como microfone" title="Celular como microfone">📱</button>
        <button id="btn-settings" class="icon-btn icon-btn--gear" type="button" aria-label="Configurações">⚙</button>
      </div>
    </header>

    <!-- z6: convites -->
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </main>

  <!-- z7: modais -->
  <div id="modal" class="modal" hidden>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal__head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-btn" type="button" aria-label="Fechar">✕</button>
      </header>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <script src="/build/app.js" defer></script>
</body>
</html>
